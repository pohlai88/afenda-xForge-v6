    def_001a_containment_proof:
      verdict: 'PROVEN — Case A holds. No modification of payroll-payments.ts is required.'
      preconditions_and_the_data_that_establishes_each:
        - precondition: 'the account belongs to the current legal entity'
          established_by: '`FundingAccount.entityId`, present on the interface and populated on all six fixture accounts'
        - precondition: 'the account is the intended default for that entity'
          established_by: '`FundingAccount.isDefault`, filtered within the entity — the exact pattern P01 and P07 already use'
        - precondition: 'the account currency'
          established_by: '`FundingAccount.currency: CurrencyCode`'
        - precondition: 'the run currency'
          established_by: '`PayRun.currency`, and `LegalEntity.currency` as the entity-level invariant'
        - precondition: 'whether the operands are currency-compatible'
          established_by: 'direct comparison of the two CurrencyCode values before any call'
      conclusion: >
        Every precondition is establishable from data the P02 caller already holds. `getFundingAccounts()`
        returns every account with its entityId and currency; the entity and the run are already in
        hand. The gate is a comparison of values, not a calculation, so it introduces no local
        funding arithmetic and no fork.
      resolved_branch: 'call fundingSummary unchanged, with an account proven to belong to this entity and to share its currency'
      unresolved_branch: >
        Produce no monetary conclusion. State that the funding position is unknown and why, and
        hand PaymentReadiness a truthful subset of gates with a matching percent. The shared
        component and the shared utility are both untouched.
      explicitly_not_zero: >
        The unresolved branch MUST NOT display a zero balance or a zero headroom. Zero is a claim
        the domain has not made. P01 displays zero alongside 'No account on file'; P02 does not
        inherit that, because its own contract requires the conclusion be removed.
      files_touched_at_step_6: ['src/app/(pages)/payroll/entities/[entityId]/page.tsx']
      payroll_payments_ts: 'UNCHANGED'

    def_004_correction_proof:
      verdict: 'PROVEN. The correction is expressible with no export signature change.'
      consumer_check:
        performed_on: '2026-09-10, immediately before recommending step 6 treatment'
        result: 'grossToNetBridge has exactly one consumer — the P02 page. Cardinality is still one.'
        contradiction: 'none'
      required_semantics:
        - 'minor-unit digits come from the existing monetary authority, `currencyDigits` in src/utils/money.ts'
        - 'a VND amount is not divided as though it had two decimal minor units'
        - 'the formatter is given the same currency truth — formatMajorUnits already accepts a digits argument and documents that it must be passed'
        - 'existing export signatures remain unchanged'
      available_authority:
        - '`currencyDigits(currency)` — 2 for most, 0 for VND'
        - '`toMajorUnits(money)` — divides by 10 ** digits, already the correct operation'
        - '`formatMajorUnits(major, symbol, digits)` — digits defaults to 2 and its own docstring says to pass currencyDigits'
      smallest_lawful_change: >
        `grossToNetBridge` derives its scale from the run currency instead of a hard-coded 100, and
        the component is given the currency digits alongside the symbol it already receives. Both
        are additive parameter and body changes within the one-consumer boundary; no exported
        signature is removed or repurposed.
      not_implemented: true

    overtime_replacement_recommendation:
      verdict: 'NO DEDICATED REPLACEMENT COMPONENT. Represent through the ATTEND exception surface.'
      proving_fields:
        - 'kind — `overtime_spike`, an existing PayRunExceptionKind'
        - 'severity — error at employee level, warning at department level, both present in fixtures'
        - 'rule — the domain states the threshold itself, e.g. department overtime above twice its trailing six-month average'
        - 'impact — Money, present on the fixtures, which supplies the ordering tie-break'
        - 'previousValue and currentValue — the magnitude of the change, e.g. 38 hours to 91 hours'
        - 'departmentId or employeeId — the smallest legitimate scope'
      why_no_component: >
        The exception already carries the condition, the rule that defines it, the magnitude of the
        change and the money at stake. Once element 21 adopts the P01 attention grammar, every one
        of those has somewhere truthful to go. Building a second card would be replacing a chart
        with another chart, which is what REPLACE explicitly does not mean.
      decisive_contrast: >
        `OVERTIME_TARGET_SHARE = 2` was invented in the page file. The exception's own `rule`
        string is authored by the domain. That is the whole difference, and it is why the signal
        survives while the chart does not.

    department_surface_recommendation:
      step_3_disposition_unchanged: 'REFINE — not altered by this step'
      finding: >
        The chips carry the entire qualifying interaction. The bar chart is `aria-hidden='true'`
        with tooltip-only interaction, sitting above an sr-only summary that already states every
        department's share, exact cost, headcount, head and delta in text.
      admission_test_applied_to_the_chart_alone:
        decision_it_changes: 'none that the chip row and the sr-only summary do not already support'
        action_once_read: 'none of its own — the action is the chip beneath it'
        same_fact_available_exactly_elsewhere: 'yes, in its own sr-only summary and in the cost labels'
        exact_value_hidden: 'partially — the bar encodes share, the label states cost'
      recommendation_for_step_5: >
        Simplify the section around the chip and filter interaction. The ranking is worth keeping;
        a full Recharts BarChart to express it is not clearly earned when the same ranking can be
        carried by the ordered chip row and the exact figures. Step 5 decides between keeping the
        bar, reducing it to a lightweight ranked row, or chips-only.
      not_a_disposition_change: true

    gap_findings:
      - id: 'P02-GAP-003'
        finding: 'NARROWED, not closed'
        evidence: >
          `getFilings()` called with no argument returns every filing, and P01 already filters by
          entity in the view layer — `groupTimeline` and `groupStatutory` both key off
          `filing.entityId`. An entity-scoped filing view is therefore reachable today with the
          same pattern, without a new accessor.
        consequence: >
          Element 25 can state statutory due dates for this entity at step 6. The gap remains
          recorded because a dedicated accessor is still the cleaner shape, and because the
          contract's own wording already called this reachable work rather than a domain gap.
        closes_the_gap: false

      - id: 'P01-GAP-002'
        finding: 'UNCHANGED — still open'
        evidence: 'No approval, funding or close deadline exists on PaySchedule or anywhere else. GroupTimeline states this in the interface rather than deriving one.'
        consequence: 'Element 25 states cut-off, payday and statutory due dates only, and carries the same standing footnote.'

      - id: 'P01-GAP-003'
        finding: 'UNCHANGED — still open'
        consequence: 'Element 36 states magnitude with VarianceValue and no attribution text.'

      - id: 'ADD-007'
        finding: 'NO RUN-PRIORITY RULE UNCOVERED — the neutral branch stands'
        evidence: >
          `EntityRow.run` is singular, so P01 never ranked two runs of one employer and
          `ACTION_RANK` was authored to rank actions, not runs. `PaySchedule.status` carries
          'open', which is a domain-stored definition of an open schedule and is materially better
          than the page-file `TERMINAL_STATUSES` constant for scoping active work — but it ranks
          nothing. Elements 3, 14 and 15 are bound accordingly.

    contradictions_discovered:
      - id: 'S4-C1'
        subject: "the KPI strip's polarity concept contradicts the accepted VarianceValue pattern"
        detail: >
          `payroll-kpi-strip` marks employer cost `higher-is-worse`, while `variance-value.tsx`
          records that valence was deliberately removed across the product because the screens
          disagreed about whether a rise was good. Element 27 already removes the strip, so
          nothing needs reopening — but element 36 MUST NOT reintroduce polarity when it restores
          the deltas.
        disposition_change: 'none'

      - id: 'S4-C2'
        subject: "P01's no-account treatment is not the pattern P02 should copy"
        detail: >
          GroupPaymentExposure renders a zero available balance beside 'No account on file'. P02's
          `states.empty.no_funding_account` requires the monetary conclusion be removed rather than
          zeroed. The P01 row is correct in its own table context, where a column must render
          something; P02's is a conclusion, and an unprovable conclusion is omitted.
        disposition_change: 'none'

