p02_entity_payroll_workspace:
  schema_version: '1.0'
  status: 'normative'
  authority: 'page-contract'

  id: 'P02'
  workspace: 'Entity Payroll Workspace'
  route: '/payroll/entities/[entityId]'
  internal_name: 'Entity Payroll Workspace'
  archetype: 'single-employer operating workspace with an embedded period ledger'

  release:
    status: 'FROZEN_V1'
    authored_on: '2026-09-08'
    frozen_on: '2026-09-10'

    frozen_revision:
      base_revision: 'd15951a'
      base_subject: 'P02 contract drafted; the last two keyboard rows close on P01'
      note: >
        `d15951a` is the revision this freeze is taken *from*. The accepted P02 implementation was
        uncommitted working-tree content on top of it, and this freeze record is itself part of that
        content, so the freeze commit cannot name its own SHA from inside itself — writing it in
        would change the hash it claims. The freeze commit is therefore the single commit whose
        parent is `d15951a` and whose message is `feat(payroll): freeze P02 entity payroll workspace
        v1`. Its SHA is reported with the freeze and is recoverable at any time with
        `git log --format=%H -1 --grep='freeze P02 entity payroll workspace v1'`.

    note: >
      Level 1 of the A15 audit model — the target product contract, defined independently of the
      current implementation. Nothing above the freeze record is a statement about what the page did
      before step 6; the current page is evidence, gathered under `current_evidence`, and evidence
      never becomes authority by being present. As of this freeze the implementation satisfies the
      contract, which is what the freeze asserts and the only thing it asserts.

    what_this_freeze_asserts: >
      The P02 page contract and its implementation are frozen. This is NOT certification that every
      inherited shared primitive or global shell element beneath the page is defect-free — two are
      known not to be, are named below, and are carried openly.

    frozen:
      - 'purpose: understand AND operate payroll for one legal employer — both verbs'
      - 'anatomy, in order: OPERATE, ATTEND, INSPECT, UNDERSTAND'
      - 'the legal employer is the `legal_entity` business object, not a heading — a company outlives any one period'
      - 'no entity-level payroll mutation is invented: every payroll mutation acts on a run, a settlement batch, a filing or a configuration record, each with an owning surface'
      - 'zero / one / multiple actionable-context law: membership is a non-terminal run, never a rank'
      - 'multiple contexts offer an in-context chooser and refuse to choose — display order is stated as display order, never as priority, urgency or a recommendation'
      - 'overtime exists through the ATTEND exception vocabulary, not a dedicated chart'
      - 'funding arithmetic requires proven entity and currency compatibility before a readiness claim is made'
      - 'gross-to-net is currency-correct — minor-unit digits are a property of the currency'
      - 'the department surface stays lightweight and operational: chips scope the work, rows state exact figures'
      - 'run history stays on the governed table engine and its object-command grammar'
      - 'period-over-period movement is neutral, never valenced — direction is not judgement'
      - 'no generic Trends or dashboard band returns'
      - 'a section narrows to what stored records prove, and says so on screen'

    reopening: >
      Any of the above requires a new entry under `divergences` stating what changed and why. A
      contract gap closing is not a reopening — it widens a section already declared narrow.

    evidence:
      architecture:
        step_3_classification: 'RATIFIED — 37 of 37 elements classified, 21 of 21 files given one outcome'
        step_4_preflight: 'COMPLETE — 23 of 23 REFINE / REPLACE / ADD subjects preflighted, project-evidence-first'
        step_5_contract: 'ACCEPTED — visual and composition contract, including the multiple-actionable-context chooser law'
        step_6_implementation: 'COMPLETE — within the fixed permitted file boundary'
        source_boundary: >
          HELD. `src/utils/payroll-payments.ts` was never modified — P02-DEF-001A was closed
          entirely at the P02 call site. No shared primitive was forked, and no file outside
          `step_6_permitted_files` was touched by the implementation.

      automated_quality:
        check_types: 'PASS — tsc --noEmit'
        lint: 'PASS — eslint'
        build: 'PASS — next build, exit code 0'
        strict_design_audit: 'PASS — all nine checks at budget'
        ratchet: >
          Satisfied at the tightened budgets. `card_titles_not_headings` was ratcheted 77 to 70
          during P02 and holds at 70/70; every other budget is unchanged and at value.

      render_validation:
        desktop: 'PASS — both themes, full page'
        narrow_390px: 'PASS — body never scrolls sideways; the table scrolls inside its own container'
        light_theme: 'PASS'
        dark_theme: 'PASS — switched with the shipped header control, never localStorage'
        P02_DEF_001A: >
          CLOSED / RENDER_CONFIRMED. Before: `ent-my` claimed 'RM319.79 short of RM242,183.79' and
          `ent-vn` '₫953,550,254 short', both computed from a Singapore SGD balance, which inverted
          the payment-readiness gate. After: `ent-my` funds from Maybank ····2208 with
          RM1,607,816.21 headroom, `ent-vn` from Vietcombank ····5190 with ₫11,422,263,346.
        P02_DEF_004: >
          CLOSED / RENDER_CONFIRMED. `ent-vn` gross-to-net read ₫12,138,257.74 while the same screen
          said ₫1,213,825,774; the two now agree. Fixed internally in `grossToNetBridge` with no
          exported signature change.

      keyboard_acceptance:
        P02_LOCAL_AUTOMATED_KEYBOARD_ACCEPTANCE: 'PASS'
        AUTOMATED_KEYBOARD_ACCEPTANCE: 'PASS_WITH_DECLARED_SHARED_DEBTS'
        HUMAN_KEYBOARD_ACCEPTANCE: 'SUPERSEDED_BY_P02_ACCEPTANCE_POLICY'

        no_manual_pass: >
          No row in this contract or in the acceptance ledger is recorded as MANUAL_PASS. No human
          keyboard pass took place. The waiver means one thing only: P02 V1 accepts browser-level
          interaction verification in place of a physical human acceptance pass.

        method: >
          Playwright 1.62.1 driving a real Chromium against the running application. Keys are
          dispatched through the browser's own input pipeline, the same path a physical keypress
          takes — confirmed at the DOM, where Shift+F10 raises a `contextmenu` reporting
          `button:-1, buttons:0, detail:0`, the keyboard signature `ObjectCommands` documents and
          distinct from a right-click's `button:2`. No `dispatchEvent`, no direct handler
          invocation, no focus set to manufacture a result. Focus indication was proved by comparing
          rendered computed style against an unfocused clone, never by a class name in source.
          Playwright is not a dependency of this repo and none was added.

        results: >
          46 AUTOMATED_BROWSER_PASS, 4 NOT_APPLICABLE across the seven gates, then the FAIL-B
          correction re-verified 5 of 5 and a seven-gate P02-local regression sweep with zero new
          P02-local failures. Detail under `automated_keyboard_acceptance` and
          `p02_local_defect_pass`.

        runtime_identity_of_final_verification:
          worktree: 'C:\JackProject\afenda-xForge-v6-dev'
          revision: 'd15951a'
          worker_pid: 12432
          parent_pid: 14408
          parent_invocation: 'node "C:\JackProject\afenda-xForge-v6-dev\node_modules\.bin\..\next\dist\bin\next" dev "--port" "3007"'
          port: 3007
          working_directory_relationship: >
            The worker's resolved module path and the parent's binary path both lie inside
            `C:\JackProject\afenda-xForge-v6-dev\node_modules`, so the server serving the verified
            pages is this worktree's and not the main checkout's.
          identity_rule: >
            Process identity established this runtime, NOT the port. `:3007` is a configuration
            coincidence and proves nothing on its own; a machine can and did run a different repo on
            it. The server was restarted after `pnpm build` — which writes the same `.next` the dev
