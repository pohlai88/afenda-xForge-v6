      payroll_payments_ts_unchanged: true
      no_source_code_changed: true
      sufficient_for_step_5: true

  # ---------------------------------------------------------------------------
  # A16 STEP 5 — ACCEPTED VISUAL AND COMPOSITION CONTRACT
  # ---------------------------------------------------------------------------

  step_5_contract:
    performed_on: '2026-09-10'
    status: 'ACCEPTED WITH ONE BLOCKED DECISION — see contradictions.S5-C1'
    authority: >
      Determines what exists, where, in what hierarchy, how it composes, how it responds, its
      action hierarchy and its conditional states. It does not determine JSX. Step 6 is execution,
      not redesign.
    section_level_unlock: >
      A12 `section_level_unlock` applies. The one blocked decision — the destination for the
      more-than-one-actionable-context branch of the primary next action — does not block the
      other sixteen, which are closed below.

    def_004_signature_boundary_check:
      performed: 'read-only inspection of the current signature, 2026-09-10'
      current_signature: 'grossToNetBridge(run: PayRun): BridgeStep[]'
      question: 'do the existing inputs contain sufficient currency truth to determine minor-unit digits?'
      finding: >
        YES. `PayRun.currency` is a CurrencyCode on the run, and every member of `PayRun.totals`
        is a `Money`, which carries its own `currency`. The digits are therefore derivable from
        arguments the function already receives.
      verdict: 'INTERNAL_NO_SIGNATURE_CHANGE_CORRECTION'
      accepted_mechanism: >
        The function replaces its hard-coded division by 100 with the existing monetary authority
        applied to the Money values it already holds. No parameter is added, no exported signature
        changes, and `BridgeStep` is unchanged.
      boundary_insufficient: false
      component_note: >
        `payroll-gross-to-net.tsx` must also stop defaulting its formatter to two digits. That
        component is P02-owned legacy composition classified RETAIN_AND_REFINE, not a shared
        authority, so supplying it the currency truth is inside the accepted boundary and is not a
        payroll-metrics signature change.

    anatomy:
      bands: ['OPERATE', 'ATTEND', 'INSPECT', 'UNDERSTAND']
      rule: >
        Four bands, in this order, vertically. No Trends or dashboard band returns. No filler
        section is introduced for symmetry. A band is legitimately absent when its domain-backed
        content is absent.

      operate:
        order:
          - id: 'return_control'
            decision: 'names the destination decoded from the validated ?return=, falling back to the group when absent'
          - id: 'entity_identity_and_object_commands'
            decision: >
              The heading is the object identity control. Object type is `legal_entity`, not
              `entity_payroll`: P02 is a payroll workspace around the legal entity, and the
              entity's conceptual identity must stay stable across Afenda domains. Commands are
              reached by right-click and by an adjacent commands button, both rendering the same
              list, Properties last.
          - id: 'identity_scope_line'
            decision: >
              One dot-separated line, not a stat-card row: country, payroll currency, registration
              number, open period, displayed run reference, lifecycle status. Facts wrap at 390px
              and keep their full text; the run reference is never truncated to hold one line.
          - id: 'primary_next_action_or_truthful_no_action_state'
            decision: 'see primary_next_action below'
          - id: 'payroll_state_surface'
            decision: >
              Retains the employer-cost hero, run reference and status, the six lifecycle stages,
              employees in run, cut-off, and the scoped blocking count. The hero figure and the
              reference/status content wrap as siblings rather than competing across a header row,
              so the figure neither clips nor shrinks below legibility.
        removed_from_operate:
          - id: 'gross_tax_deductions_net_strip'
            moves_to: 'INSPECT'
        period_statement:
          decision: >
            Elements 4 and 16 are ONE composition. A single contextual in-band statement names the
            open period and the displayed run when they differ. There is no separate banner card
            and no second mismatch sentence for the same condition. The period is derived, never
            written as a literal.
        blocking_count:
          decision: >
            Counted from the same scoped exception set the attention surface receives, and the
            tile states the scope it counted. An unfiltered count beside a filtered list is not
            permitted.

      attend:
        order: ['needs_attention', 'funding_and_readiness', 'dated_obligations']
        rule: 'One band, in this order. Not split into unrelated dashboard cards to fill a grid.'

      inspect:
        order: ['gross_tax_net_totals', 'gross_to_net_bridge', 'department_scope', 'run_history']
        rule: 'Inspection and decomposition, not the operating hierarchy.'

      understand:
        order: ['period_over_period']
        rule: 'Deliberately narrow, and may be empty.'

    primary_next_action:
      law: >
        P02 has no entity-level payroll mutation and one conditional primary navigation action
        into legitimate payroll work. A run is never chosen by `.find()`, fixture order, array
        order or incidental status ordering. ADD-007 is the binding non-visible rule.
      branches:
        - condition: 'zero actionable payroll contexts'
          control: 'none'
          state: 'A truthful state — no payroll work currently requires action. No CTA is fabricated.'
          status: 'ACCEPTED'
        - condition: 'exactly one actionable payroll context'
          control: 'Open {run reference}'
          destination: '/payroll/runs/{runId} — the existing run workspace'
          reasoning: 'Naming the only candidate is not a priority decision.'
          status: 'ACCEPTED'
        - condition: 'more than one actionable payroll context'
          control: 'Choose payroll work — one primary chooser trigger, never several competing primaries'
          destination: >
            Activating it exposes this employer's actionable payroll contexts inside the P02
            workspace. Each item navigates to that context's existing run workspace,
            /payroll/runs/{runId}. No new route is created.
          status: 'ACCEPTED — resolved by the multiple-actionable-context decision of 2026-09-10'
          binding: >
            MUST NOT navigate to a generic queue, MUST NOT select one context as the priority,
            MUST NOT create a new route, and MUST NOT silently make the run history ledger the
            operational destination.

      multiple_actionable_contexts:
        decision_recorded: '2026-09-10'
        resolution_scope: 'inside P02'
        forbidden_resolutions:
          - 'modifying /payroll/runs or P04 merely to provide an entity-filtered destination for P02'
          - 'shipping P02 with an intentionally unsupported more-than-one branch'
          - 'a new entity-level payroll queue route'

        actionable_context:
          definition: 'a pay run of this legal entity that has not reached a terminal status'
          terminal_statuses: ['paid', 'closed', 'cancelled', 'failed']
          provenance: >
            Stated honestly: this set is not a domain export. It is declared identically and
            independently in two page files — the P02 page and `/payroll/runs/[runId]/page.tsx` —
            and it matches how `stageIndexForStatus` treats runs that are off the stage path. It
            is therefore an established presentation-level classification of membership, not a
            domain record.
          why_this_is_legitimate: >
            It defines which runs are in the collection, not how they rank against each other.
            Membership is not priority, so it does not reopen ADD-007 or invent an ordering the
            domain does not hold.

        chooser_content:
          rule: 'only enough domain-backed information to distinguish one context from another'
          anatomy:
            - 'run reference'
            - 'payroll period'
            - 'lifecycle status'
            - 'blocker or attention count, or a truthful next-state detail, where the domain supplies one'
          semantic_shape_example: ['PR-SG-2026-09', 'Sep 2026 · Pending approval', '2 blockers']
          forbidden: 'any explanatory text the domain cannot prove'

        ordering:
          classification: 'PRESENTATION ORDERING ONLY'
          existing_authority_used: >
            `runsForEntity(runs, entityId)` in src/utils/payroll-group.ts already filters to one
            employer and sorts by `periodStart`. It is an existing neutral run ordering authored
            for exactly this collection, so it is reused rather than replaced.
          display_order:
            - 'payroll period descending'
            - 'run reference ascending as the tie-break'
          MUST_NOT_be_described_as: ['priority', 'urgency', 'recommended order', 'next best action']
          MUST_NOT_use:
            [
              '.find()',
              'fixture order',
              'arbitrary array order',
              'ACTION_RANK',
              'ENTITY_STATE_ORDER',
              'lifecycle rank as a proxy for importance'
            ]

        interaction:
          shape: 'one primary decision with multiple legitimate destinations'
          MUST_NOT: 'render several competing primary buttons'
          accepted_pattern: 'inline disclosure built on the existing `src/components/ui/collapsible` primitive'
          pattern_evidence: >
            No accepted project chooser-of-work pattern exists. `EntityPicker` is a Select that
            rewrites a URL scope — a scope picker, not a navigation chooser, and P02 already
            rejects an entity picker in its header. Per the decision's own rule 2, the simplest
            existing disclosure composition is used: `Collapsible` is Base UI, already in
            `src/components/ui`, and already consumed elsewhere in the app. No new primitive
            system and no external pattern is introduced.
          rejected_alternative:
            pattern: 'DropdownMenu overlay'
            reason: >
              It would work, but it puts the entire chooser behind a Base UI dropdown trigger that
              this project's browser automation cannot open — `keyboard.known_harness_limits`
              records it — so every item would reach the manual acceptance ledger as NOT VERIFIED.
              An inline disclosure keeps the chooser renderable and screenshot-verifiable, and the
              decision's own wording asks for the contexts to be exposed 'in the current P02
              workspace' rather than in a floating layer.
          requirements:
            - 'pointer operable'
            - 'keyboard operable'
            - 'visible focus ring in both themes'
            - 'Escape and close behaviour where an overlay pattern is used — not applicable to an inline disclosure'
            - 'focus restoration to the originating trigger'
            - 'exactly one reachable target per payroll context'

        ownership:
          - 'P02 composition responsibility'
          - 'no P04 modification'
          - 'no /payroll/runs route contract change'
          - 'no src/utils/payroll-payments.ts change'
          - 'no new entity-level payroll queue route'

        add_007_status: >
          CLOSED as an architecture decision by this chooser law. Closure asserts no priority rule:
          the chooser refuses to rank, which is precisely how it satisfies the constraint ADD-007
          existed to enforce.

    supporting_run_navigation:
      decision: >
        The buried 'Open run workspace' control does not remain as a competing primary. Where a
        displayed run exists, supporting navigation is retained at lower emphasis, labelled to
        describe inspecting the displayed run rather than deciding what matters most — 'View run
        details' or equivalent. Never two equally prominent controls to the same place.
      return_path:
        decision: 'carried, per the established convention'
        limitation: >
          `?return=` is read today only by P02 itself. `/payroll/runs/[runId]` accepts no
          searchParams and its workspace reads only `view` and `employee` through nuqs, so a
          return path carried into P04 is inert until P04 adopts it. Recorded rather than worked
          around; P04 is outside this programme step.

    exception_items:
      grammar: 'the accepted P01 attention grammar — no P02-only exception vocabulary'
      each_item_exposes:
        ['what happened', 'severity', 'consequence or impact', 'smallest legitimate scope', 'where it leads']
      ordering: 'EXCEPTION_SEVERITY_ORDER first, then PayRunException.impact as the tie-break within a severity'
      interaction: 'one keyboard-reachable target per item — the destination control, never a link nested inside a button'
      destinations:
        rule: >
          Real and appropriate to the kind. Where a kind has no more specific legitimate
          destination, the existing run exception work context is used rather than a dead row.
        verified_available:
          - "/payroll/runs/{runId}?view=exceptions — 'exceptions' is a real member of the workspace VIEWS literal, and the workspace owns acknowledgeException, resolveException and reopenException"
          - '/payroll/runs/{runId}?employee={employeeId} — the employee inspector, for an exception whose subject is one person'
        forbidden: ['a new route for an exception', 'a new route for an employee', 'a row that leads nowhere']
      entity_return_path: 'carried, subject to the same limitation recorded under supporting_run_navigation'

    overtime:
      decision: 'NO dedicated replacement chart and NO dedicated replacement card.'
      composition: >
        The overtime trend leaves P02 composition entirely. The domain-authored `overtime_spike`
        exception is represented through the ATTEND exception surface, carrying its own rule,
        severity, impact, previous and current values, and its employee or department scope.
      forbidden:
        - 'retaining OVERTIME_TARGET_SHARE anywhere'
        - 'reproducing its invented visual threshold in any form'

    funding_and_readiness:
      resolved_branch:
        preconditions_all_required:
          - 'the account belongs to the current legal entity'
          - 'the account is the applicable default under existing semantics'
          - 'the account currency is known'
          - 'the run and entity currency is known'
          - 'the operands are currency-compatible'
        then: 'the existing shared calculation is called unchanged'
        shared_debt: 'P02-DEF-001B remains OPEN'
      unresolved_branch:
        must_not_render:
          - 'a zero balance'
          - 'a zero headroom'
          - 'a mixed-currency result'
          - 'a guessed currency'
          - 'a full payment-readiness percentage'
        renders_instead: >
          A truthful unresolved statement — the funding position cannot be determined because no
          compatible funding account is available — and an explicit statement that payment
          readiness is not fully evaluated because funding is unresolved.
        known_checks: 'the non-funding gates MAY remain visible'
        aggregate_rule: >
          No aggregate number or percentage may be shown under Payment readiness that could
          reasonably read as complete readiness while the funding gate is unknown.
        shared_model: 'ReadinessCheck.done stays a boolean. P02 does not modify the shared model, and does not touch payroll-payments.ts.'
      placement: 'ATTEND, second, between the attention surface and dated obligations'

    dated_obligations:
      composition: 'a compact labelled obligations list or rail inside ATTEND'
      forbidden: 'a timeline adopted merely because a timeline component exists'
      rows:
        - 'Payroll cut-off'
        - 'Pay date'
        - 'Statutory filing due'
      rule: >
        Three separate business concepts, never labelled generically as deadlines. The statutory
        row renders only where entity-scoped filing evidence exists. No approval deadline is
        inferred from a filing due date.
      gaps: 'P02-GAP-003 narrowed but open; P01-GAP-002 open'
      responsive:
        desktop: 'a compact structured rail is acceptable'
        mobile_390: 'rows stack vertically and keep full labels and dates'

    gross_to_net:
      band: 'INSPECT, second'
      decision: >
        The bridge retains its distinct explanatory purpose and the existing waterfall may remain,
        provided it reads legibly once the currency handling is truthful. It is never a hero, and
        it carries no directional success or error semantics.
      blocking: 'P02-DEF-004 must be fixed before freeze, by the internal no-signature-change correction accepted above.'

    department_surface:
      decision: 'remove the heavyweight analytical chart treatment; retain the ranking and the filter interaction'
      composition: ['lightweight ranked department rows', 'the existing department chips and filter affordance']
      rule: >
        The chips remain the actual navigation and filter interaction. The visualization is not
        made interactive to duplicate them, and a full Recharts bar chart is not kept merely
        because the legacy component contains one.
      classification: 'REFINE — not a new analytics surface'

    run_history:
      engine: 'the governed table engine, unforked'
      change: 'add calculation_version as a real column, from PayRun.calculationVersion'
      forbidden: ['a second table', 'synthetic version text', 'a separate card to expose it']
      responsive: 'horizontal scroll within its own container, per the governed engine'

    period_over_period:
      band: 'UNDERSTAND'
      comparison_set: ['employer cost', 'gross payroll', 'net payroll', 'headcount']
      rule: >
        Only figures directly supported by consecutive run records. Neutral VarianceValue grammar
        — direction is not valence. No green for increase, no red for decrease, no business
        judgement inferred from direction, and no explanation of why a value moved.
      gap: 'P01-GAP-003 remains open'

    descriptors:
      file: 'src/views/payroll/payroll-objects.ts'
      identities: ['legal entity', 'payroll exception']
      rule: 'existing vocabulary and CRUD-SAP grammar, additive only, no existing export signature change, no P02-specific schema'

    responsive_contract:
      desktop:
        - 'the four-band vertical hierarchy is preserved'
        - 'no return to a grid-cols-6 dashboard composition'
        - 'internal responsive layouts only where two pieces of information genuinely belong together'
      mobile_390:
        - 'bands stay in the same semantic order'
        - 'identity facts wrap and keep their text'
        - 'figures do not clip'
        - 'action labels stay understandable'
        - 'obligations stack'
        - 'the table uses the governed horizontal behaviour'
        - 'no semantic interaction changes because width changed'
      binding: 'Responsive compression MUST NOT reorder ATTEND beneath analytics or otherwise alter page meaning.'

    visual_density:
      prefer:
        [
          'compact factual rows',
          'labelled values',
          'one consequential action',
          'attention items',
          'the governed table',
          'restrained explanatory visualisation'
        ]
      avoid:
        [
          'decorative metric cards',
          'chart grids',
          'repeated section captions',
          'hero duplication',
          'empty-card placeholders',
          'symmetry as a reason to retain content'
        ]
      rule: 'A section with no legitimate content is absent.'

    contradictions:
      - id: 'S5-C1'
        stop_condition: 1
        status: >
          RESOLVED_BY_DECISION on 2026-09-10. The gap in the route architecture is real and
          unchanged — no entity-scoped payroll-work collection exists — but P02 no longer needs
          one. The multiple-actionable-context decision resolves the branch inside P02 with a
          chooser whose items navigate to existing run workspaces. Recorded as resolved for P02,
          not as a route gap that was closed.
        subject: 'no existing entity-scoped payroll-work collection destination'
        evidence: >
          `/payroll/runs/page.tsx` is a server component that accepts no searchParams at all and
          calls `getPayRuns()` group-wide. Its entity filter is client-side React state
          (`useState('all')` in run-queue-table), not URL state, so no link can pre-scope it to
          one employer. The only entity-scoped destinations that exist are
          `/payroll/payments?entity=`, `/payroll/compliance?entity=` and `/payroll/reports?entity=`,
          and none of them is a payroll-work or run collection — the contract's `is_not` and
          `drill_down.navigates` assign those to P07, P08 and P09 for different tasks.
        consequence: >
          The more-than-one-actionable-context branch of the primary next action has no truthful
          destination. Its Step 5 decision is BLOCKED. The other two branches are accepted and
          unaffected.
        reachability: >
          The branch is not reachable in the current fixtures — every entity has one monthly pay
          group and at most one non-closed run. It must still be specified, because
          `domain_truth.MUST_NOT` forbids assuming one run per entity per period and
          `multiple_pay_groups` requires the page be built so that N open runs is a legitimate
          answer.
        not_improvised: 'No destination invented, no route created, no arbitrary run selected.'
        requires: 'an explicit decision before the branch can be implemented'

      - id: 'S5-C2'
        stop_condition: 'none — recorded limitation'
        subject: 'the return path carried into P04 is inert'
        evidence: >
          `?return=` is consumed only by P02. `/payroll/runs/[runId]/page.tsx` accepts no
          searchParams, and its workspace reads only `view` and `employee`.
        consequence: >
          P02 carries the return path per the accepted convention and per the step 5 instruction,
          but returning from P04 does not work until P04 adopts it. P04 is outside this programme
          step; recorded rather than worked around.
        resolution: >
          SUPERSEDED on 2026-09-10 by the pre-freeze correction. Carrying an unread parameter was
          itself the defect: an address that looks like context preservation without being it. P02
          now navigates to `/payroll/runs/{runId}` with no return parameter, and the missing
          capability is recorded as P02-GAP-004 rather than simulated from this side.

    decisions_closed:
      - { id: 2, decision: 'legal_entity object type, heading is the identity control, Properties last' }
      - { id: 3, decision: 'one dot-separated identity line; wraps at 390px; run reference never truncated' }
      - {
          id: '4+16',
          decision: 'ONE in-band contextual period statement; no banner plus second sentence; period derived'
        }
      - { id: '8+13', decision: 'hero and reference wrap as siblings; totals strip leaves OPERATE for INSPECT' }
      - { id: 12, decision: 'blocking count from the scoped set, and the tile states its scope' }
      - { id: 14, decision: "supporting lower-emphasis 'View run details' for the displayed run; return path carried" }
      - { id: 15, decision: 'three-branch law accepted; branches 1 and 2 closed; branch 3 BLOCKED on S5-C1' }
      - { id: 21, decision: 'P01 attention grammar; impact tie-break; one target per item; destinations verified real' }
      - {
          id: 23,
          decision: 'resolved and unresolved readiness behaviour defined; no aggregate percentage while funding is unknown'
        }
      - { id: 24, decision: 'funding sits second in ATTEND, after attention, before obligations' }
      - { id: 25, decision: 'compact labelled obligations rail; three separate concepts; stacks at 390px' }
      - { id: 26, decision: 'truthful unresolved copy intent, in place of the monetary conclusion; never zero' }
      - {
          id: 29,
          decision: 'INSPECT second; waterfall may remain once currency is truthful; never a hero; no directional semantics'
        }
      - {
          id: 31,
          decision: 'lightweight ranked rows plus the existing chips; the heavyweight chart treatment is removed'
        }
      - { id: 32, decision: 'calculation_version as a real column on the governed engine' }
      - { id: 34, decision: 'no dedicated replacement; represented through the ATTEND exception surface' }
      - { id: 36, decision: 'employer cost, gross payroll, net payroll, headcount — neutral VarianceValue only' }

    step_6_permitted_files:
      rule: 'The exact set step 6 may touch. Anything absent from this list is out of scope for step 6.'
      primary:
        - 'src/app/(pages)/payroll/entities/[entityId]/page.tsx'
        - 'src/views/dashboards/payroll/payroll-run-status.tsx'
        - 'src/views/dashboards/payroll/payroll-exception-queue.tsx'
        - 'src/views/dashboards/payroll/payroll-gross-to-net.tsx'
        - 'src/views/dashboards/payroll/payroll-run-history.tsx'
        - 'src/views/dashboards/payroll/payroll-by-department.tsx'
      new:
        - 'src/views/payroll/entity/** — created only as the accepted composition requires'
      additive_shared:
        - 'src/views/payroll/payroll-objects.ts — entity and exception descriptors, additive only'
        - 'src/utils/payroll-metrics.ts — grossToNetBridge internal correction, no signature change'
      unimported_not_deleted:
        - 'src/views/dashboards/payroll/payroll-kpi-strip.tsx'
        - 'src/views/dashboards/payroll/payroll-stat-card.tsx'
        - 'src/views/dashboards/payroll/payroll-overtime-trend.tsx'
        - 'src/views/dashboards/payroll/payroll-cost-trend.tsx'
      blocked:
        - 'src/utils/payroll-payments.ts'
      read_only:
        - 'src/components/shared/**'
        - 'src/utils/payroll-group.ts'
        - 'src/utils/money.ts'
        - 'src/app/server/**'
        - 'src/fake-db/**'
        - 'src/views/payroll/payments/**'
        - 'src/views/payroll/reports/reports-workspace.tsx'
        - 'src/views/payroll/group/** — read as pattern authority, never edited by P02'
      out_of_scope: ['_archive/**']

    completion:
      every_step_4_decision_closed: true
      blocked_decisions: []
      all_other_decisions_closed: true
      no_frontend_files_created: true
      no_source_modified: true
      closed_by: >
        The multiple-actionable-context decision of 2026-09-10 closed decision 15, which was the
        only outstanding one. Step 5 is complete.

  # ---------------------------------------------------------------------------
  # A16 STEP 6 — IMPLEMENTATION GATE
  # ---------------------------------------------------------------------------

  step_6_gate:
    evaluated_on: '2026-09-10'
    verdict: 'PASSED — implementation may begin within step_5_contract.step_6_permitted_files'
    implementation_started: false

    destination_verification:
      requirement: >
        Before implementation, verify that every actionable context returned by the P02 selector
        has an existing legitimate destination. If any lacks one, stop that branch and report the
        gap rather than inventing one.
      method: 'read-only source inspection'
      result: >
        PASS. Every actionable context is a `PayRun` of this entity, and every PayRun resolves to
        `/payroll/runs/{runId}` — an existing route whose page loads the run through `getPayRun`
        and calls `notFound()` when it does not exist. No context class lacks a destination, so no
        branch is stopped.
      branches_verified:
        [
          'zero — renders a truthful state, needs no destination',
          'exactly one — /payroll/runs/{runId}',
          'more than one — one chooser item per run, each to /payroll/runs/{runId}'
        ]

    preconditions:
      step_3_ratified: true
      step_4_preflight_complete: true
      step_5_contract_accepted: true
      all_step_5_decisions_closed: true
      def_001a_containment_path_proven: true
      def_004_correction_path_proven: true
      def_004_signature_boundary: 'INTERNAL_NO_SIGNATURE_CHANGE_CORRECTION'
      payroll_payments_ts: 'BLOCKED — unchanged'
      every_destination_exists: true

    quality_gates_to_run_before_claiming_completion:
      - 'pnpm check-types'
      - 'pnpm lint'
      - 'pnpm build'
      - 'python .claude/skills/xforge-design-system/scripts/audit.py — ratchet no worse than at freeze'
      - 'rendered validation per visual_validation, both themes, desktop and 390px'
      - 'ux_acceptance from the doctrine, every line'

    standing_constraints:
      - 'consumer check re-run immediately before any component move or removal'
      - 'no component deleted merely because P02 stops consuming it'
      - 'keyboard gates the harness cannot exercise are written to the manual acceptance ledger as NOT VERIFIED, never as a pass'
      - 'ports are not identity — re-verify the dev server worktree before trusting any rendered reading'

  # ---------------------------------------------------------------------------
  # PRE-FREEZE CORRECTION AND ACCEPTANCE PASS
  # ---------------------------------------------------------------------------

  pre_freeze_pass:
    performed_on: '2026-09-10'
    verdict: 'BLOCKED_BY_HUMAN_ACCEPTANCE'
    blocking_criterion: 'reachable human keyboard checks require physical human observation and have not been performed'

    status_of_record:
      recorded_on: '2026-09-10'
      STEP_6_IMPLEMENTATION: 'COMPLETE'
      AUTOMATED_QUALITY_GATES: 'PASS'
      RENDER_VALIDATION: 'PASS_WITH_DECLARED_FIXTURE_GAPS'
      HUMAN_KEYBOARD_ACCEPTANCE: 'PENDING_EXTERNAL_HUMAN'
      FREEZE_STATUS: 'BLOCKED_BY_HUMAN_ACCEPTANCE'

      classification: >
        This is NOT a P02 defect. It is an outstanding acceptance dependency. The implementation is
        complete and stable; what is missing is an observation only a person can make.

      excluded_substitutes:
        rule: >
          None of these may close a reachable human keyboard row, individually or in combination.
        list:
          - 'source inspection'
          - 'browser automation'
