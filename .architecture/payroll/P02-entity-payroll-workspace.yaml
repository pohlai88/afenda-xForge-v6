    fail_b:
      classification: 'BLOCKING_LOCAL_DEFECT'
      boundary: 'P02_LOCAL'

      root_cause: >
        The Clear filter control is rendered by the very state it removes. `EntityAttention` renders
        it inside `CardAction` only while `departmentFilter` is set, so activating it navigates to a
        URL without `dept`, the server re-renders the card without the control, and the element that
        held focus is unmounted. The browser has nowhere to put focus and drops it to `<body>`. The
        defect is not the navigation and not the query handling — both were already correct — it is
        that a control which destroys itself on activation named no successor for focus.

      why_the_chip_path_was_never_affected: >
        Toggling the selected department chip off changes the same query string, but the chip
        survives the transition because it is rendered from the department list rather than from the
        filter state. Focus stayed on it and was still visibly indicated. That contrast is what
        located the defect precisely: the page can update this query without losing focus, so the
        fault was specific to the self-removing control.

      target_selection:
        rule_applied: 'preference order from the instruction'
        option_1_stable_control_in_the_surface: >
          UNAVAILABLE. After clearing, nothing filter-related remains mounted in the Needs attention
          surface — `CardAction` and its control are gone, and the department chips belong to the
          Cost by department card, which is a different task context.
        option_3_existing_project_pattern: >
          UNAVAILABLE. The nearest patterns — `QueryPanel`'s `returnFocus` and `ObjectContextMenu`'s
          `finalFocus` — both restore focus to a remembered element that still exists. Here the
          element that had focus is destroyed, which is a different transition, so neither pattern
          applies and neither was bent to fit.
        option_2_chosen: >
          The section heading takes focus. It names where the reader still is, it is where the
          now-unfiltered list begins, and it is the smallest thing in the surface that survives the
          transition.

      focus_restoration_mechanism: >
        `CardTitle` receives a ref and `tabIndex={-1}`, which makes it programmatically focusable
        without adding a tab stop — the traversal is unchanged at 57 P02-owned stops. A `clearing`
        ref is set in the Clear control's own `onClick`, and an effect keyed on `departmentFilter`
        moves focus to the heading only when the filter has gone AND that flag is set. The flag is
        what keeps the behaviour narrow: arriving unfiltered, or clearing the filter by toggling the
        chip, does not move anyone's focus. Indication uses the app's own ring utilities
        (`focus-visible:ring-ring/50 focus-visible:ring-3 outline-none`), so a keyboard clear shows
        the ring and a pointer clear does not, which is the correct behaviour for each.

      file_changed: 'src/views/payroll/entity/entity-attention.tsx'
      files_changed_count: 1
      shared_primitives_touched: 0
      global_infrastructure_touched: 0
      new_wrappers_or_systems: 0
      boundary_respected: >
        Only the P02-local file that owns the Clear-filter transition was modified. No shared
        primitive, no router or query infrastructure, no ObjectCommands or sheet, no global shell.

      evidence:
        repetitions: 5
        result: '5/5 AUTOMATED_BROWSER_PASS'
        per_repetition_observed: >
          Clear filter reached by 40 real Tab presses; Enter activates; the URL becomes
          `?run=PR-SG-2026-09` with `dept` dropped and `run` kept; focus lands on the element with
          `data-slot="card-title"`, `role="heading"`, `aria-level="2"`, `tabIndex -1`, inside the
          Needs attention card; focus indication is a rendered computed change and `:focus-visible`
          matches; the Clear control is gone with no disabled remnant behind it; the previously
          focused node is confirmed detached from the document. Identical in all five.
        focus_before: 'A "Clear filter"'
        focus_after: 'the Needs attention section heading — never <body> in any repetition'

