          status: 'OPEN_SHARED_DEBT'
          boundary: 'GLOBAL_SHELL'
          observed: 'two anchors take tab stops and do nothing when activated'
          reproduced_outside_p02: '/payroll (P01, already FROZEN_V1), /payroll/runs, /dashboard/ecommerce'
          p02_position: 'did not introduce it and did not modify the global shell'

    carried_domain_and_programme_debt:
      rule: 'Still open at freeze. None is silently closed by this freeze.'
      items:
        - id: 'P02-DEF-001B'
          status: 'OPEN'
          subject: 'shared funding authority debt in `payroll-payments.ts`, which remains BLOCKED FOR MODIFICATION'
        - id: 'P01-GAP-001'
          status: 'OPEN — inherited'
        - id: 'P01-GAP-002'
          status: 'OPEN — inherited'
        - id: 'P01-GAP-003'
          status: 'OPEN — inherited'
        - id: 'P01-GAP-004'
          status: 'OPEN — inherited'
        - id: 'P02-GAP-001'
          status: 'OPEN'
        - id: 'P02-GAP-002'
          status: 'OPEN'
        - id: 'P02-GAP-003'
          status: 'OPEN'
        - id: 'P02-GAP-004'
          status: 'OPEN'
          retained_meaning: >
            Explicit P02 to P04 return-context handling is NOT implemented, because P04 does not
            currently consume a return destination. The inert `?return=` parameter that P02 once
