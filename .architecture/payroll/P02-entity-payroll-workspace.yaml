  step_4_preflight:
    performed_on: '2026-09-10'
    step: 'A16 step 4 — for every REFINE, REPLACE and ADD: check existing Afenda, assign confidence, select the mode, inspect minimum evidence, decide the frontend shape'
    authority: 'evidence only. No frontend source modified, no component moved, no composition created, no defect fixed.'
    population: '23 visible subjects — 13 REFINE, 4 REPLACE, 6 ADD. ADD-007 is a non-visible binding constraint, not a subject.'

    evidence_law_outcome:
      studio_items_inspected: 0
      reason: >
        A12 evidence budget is a cap, not a quota. P01 is FROZEN_V1 and accepted, and it already
        carries a shipped pattern for every P02 subject that a Studio reference could have
        informed. Every budget-1 and budget-2 item therefore resolved at zero external evidence.
        No arbitrary UI library was browsed. No second primitive system is proposed.
      primitive_compatibility: >
        Uniform across all 23 subjects: every recommended mechanism composes primitives already in
        `src/components/ui` plus already-shipped payroll views. Zero `@radix-ui` packages are
        introduced, no second primitive system, no second shell, theme, sidebar or table engine.

    project_patterns_reused:
      - path: 'src/views/payroll/group/group-attention.tsx + src/utils/payroll-group-attention.ts'
        learned: >
          The accepted attention-item grammar: severity badge, scope, optional dueLabel, reason,
          consequence, and exactly one destination rendered as a Button that renders a Link — one
          tab stop per item, no link nested inside a button. Plus the empty state that names what
          was checked, and a cap rather than a target.
        applies_to: [21, 22, 34]
        rejected: 'the current card-and-ScrollArea composition; any second exception idiom'
        adaptation: 'entity scope instead of group scope; add the impact tie-break P01 did not need'

      - path: 'src/views/payroll/group/group-next-actions.tsx + NextAction / ACTION_RANK'
        learned: 'a task row with task, scope, dueLabel and one destination; lifecycle ordering, not severity ordering'
        applies_to: [14, 15]
        rejected: >
          reusing ACTION_RANK as a run-priority rule. It ranks actions across entities where
          `EntityRow.run` is singular; it was never authored to rank two runs of one employer.
        adaptation: 'required — see multiple_open_runs and ADD-007'

      - path: 'src/views/payroll/group/group-payment-exposure.tsx and the P01 page account selection'
        learned: >
          Entity-scoped account resolution, every row in its own currency, never converted, and
          the shipped no-account treatment. The card states explicitly why no group figure exists.
        applies_to: [24, 26]
        rejected: >
          P01 renders `available` as zero alongside 'No account on file'. P02 MUST NOT display
          zero for an unprovable position — its own `states.empty.no_funding_account` requires the
          monetary conclusion be removed, not zeroed.
        adaptation: 'required on the unresolved branch'

      - path: 'src/views/payroll/group/group-timeline.tsx + groupTimeline / TimelineEvent'
        learned: >
          Three separately-typed dated obligations — cutoff, payday, statutory — never merged into
          a generic deadline, with a standing footnote naming what is not stored. Whole row is the
          control, matching the next-actions shape.
        applies_to: [25]
