      verdict: 'NO_TRUTHFUL_DETERMINISTIC_RUN_PRIORITY — unchanged from primary_action.run_selection'
      classification_consequence: >
        The primary next action (ADD-001) is classified around the collection of this employer's
        active payroll work, not around a selected run. A specific run may be named only when the
        contract's `when_exactly_one_run_is_open` branch is genuinely satisfied by a proven
        definition of open — and no such definition exists in the domain today. `TERMINAL_STATUSES`
