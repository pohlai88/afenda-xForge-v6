          - 'P02 cannot produce the unsafe mixed or unproven funding state'
          - 'no local fork of the shared calculation exists'
          - 'the freeze record explicitly carries P02-DEF-001B as external shared debt'

      - id: 'P02-DEF-004'
        subject: 'minor-unit scale hard-coded to two decimals in the gross-to-net bridge'
        classification: 'P02-OWNED CONSUMER / ADDITIVE-SHARED FIX / ONE CONSUMER'
        affected_element: 29
        status: 'ESTABLISHED_FROM_SOURCE + RENDER_CONFIRMED'
        evidence: >
          `grossToNetBridge` (src/utils/payroll-metrics.ts) divides each total by a hard-coded
          100 rather than by `10 ** currencyDigits(currency)`, and
          `payroll-gross-to-net.tsx` calls `formatMajorUnits` without passing currency digits.
          Rendered on ent-vn on 2026-09-10: the bridge stated ₫12,138,257.74 gross with two
          decimals while the run status card and the run history stated ₫1,213,825,774 on the same
          screen.
        why_it_violates_the_contract: >
          domain_truth.MUST 'state every figure in the entity own currency'; acceptance.hard_failures
          'a state the domain cannot prove'. money.ts already documents VND as zero-decimal and
          formatMajorUnits already documents that currency digits must be passed, so the domain
          knows the fact the page discards.
        disposition: 'REFINE — see element 29'
        permitted_additive_shared_target: 'src/utils/payroll-metrics.ts'
        boundary: 'ADDITIVE-SHARED / ONE CONSUMER / NO EXISTING EXPORT SIGNATURE CHANGE'
        consumer_check:
          performed_on: '2026-09-10'
          result: 'grossToNetBridge has exactly one consumer — the P02 page. No contradiction to the one-consumer assumption.'
          rule: 'Re-verified immediately before any step 6 change, never inferred from this record.'
        not_implemented: 'Recorded only. No change made at step 3.'

