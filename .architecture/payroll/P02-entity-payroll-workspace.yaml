        so `package.json`, `pnpm-lock.yaml` and `node_modules` are untouched.
      key_delivery: >
        Every key is dispatched through the browser's own input pipeline (CDP Input.dispatchKeyEvent),
        which is the same path a physical keypress takes. Confirmed at the DOM: Shift+F10 raises a
        `contextmenu` event reporting `button:-1, buttons:0, detail:0` — the keyboard signature the
        component itself documents, distinct from a right-click's `button:2`.
