  # ---------------------------------------------------------------------------
  # VISUAL VALIDATION
  # ---------------------------------------------------------------------------

  visual_validation:
    method: 'architecture A15 visual_validation_method, in full'

    required_captures:
      - desktop_sidebar_expanded
      - desktop_sidebar_collapsed
      - tablet
      - mobile_390
    themes: [light, dark]

    must_verify:
      - focus_order
      - table_overflow_within_its_own_container
      - empty_states
      - loading_state
      - the_page_body_never_scrolls_horizontally
      - status_colour_contrast_at_or_above_4_5_to_1_in_both_themes

    entities_to_capture:
      rule: >
        One entity is not a rendering. The captures MUST include at least one entity in each
        materially different state, because the state is what the page reports.
      minimum:
        - 'an entity with a blocked run'
        - 'an entity with an approved run'
        - 'an entity whose open period is awaiting data'
        - 'an entity in a currency other than SGD, which is what P02-DEF-001 corrupts'

    rule_restated: >
      Source and composition validation is not rendered UI validation. A15 lists spacing, dark
      mode, focus order, keyboard, overflow and touch ergonomics as things a source audit cannot
      validate. Final approval requires the rendered application.

  # ---------------------------------------------------------------------------
  # ACCEPTANCE AND FREEZE
  # ---------------------------------------------------------------------------

  acceptance:
    scoring:
      immediate_orientation: 10
      operational_usefulness_for_one_employer: 25
      blocker_and_action_clarity: 20
      next_step_correctness: 10
      drill_down_and_context_preservation: 10
      information_hierarchy_and_density: 10
      domain_and_financial_truth: 10
      visual_and_responsive_quality: 5

    minimum: 85

    rule: 'Hard failures override the numerical score.'

    hard_failures:
      - 'a funding position compared against an account belonging to another legal entity'
      - 'arithmetic across two currencies'
      - 'a primary button that promises a mutation the domain cannot perform'
      - 'a run chosen or ranked by array position, unsorted find, or fixture order'
      - 'a target, threshold or benchmark the domain does not store'
      - 'a section retained with a caption admitting it needs no action'
      - 'a state the domain cannot prove'
      - 'navigation presented as ranked work'
      - 'a second table engine, or the run history table rebuilt as a domain-local table'
      - 'a second attention idiom for a concept P01 already owns'
      - 'the open period state and the displayed run conflated'

    gates:
      - 'pnpm check-types'
      - 'pnpm lint'
      - 'pnpm build'
      - 'python .claude/skills/xforge-design-system/scripts/audit.py — ratchet no worse than at freeze'
      - 'rendered validation per visual_validation above'
      - 'ux_acceptance from the doctrine, every line'

    freeze_criteria:
      - 'every section in anatomy renders, or is recorded as a contract gap with its provable form shipped'
      - 'every file in files_in_scope carries a step-3 classification and its outcome'
      - 'every chart carries a chart_policy verdict and the verdict has been applied'
      - 'P02-DEF-001 fixed and confirmed on a non-SGD entity in the rendered page'
      - 'the consumer check re-run immediately before any component move or removal'
      - 'inherited and new gaps restated as still open, or closed with evidence'
      - 'keyboard gates either observed or written into the manual acceptance ledger as NOT VERIFIED'

    reopening: >
      Any change to purpose, information hierarchy, operational hierarchy, primary action decision,
      or a rejected control requires a new entry under `divergences` stating what changed and why.
      A contract gap closing is not a reopening — it widens a section already declared narrow.

