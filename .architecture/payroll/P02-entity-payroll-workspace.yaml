    carried_verification_debt:
      rule: >
        Frozen with these coverage states unchanged. Neither is a defect, and no fixture was mutated
        to close either. `src/fake-db/**` was not modified at any point in the P02 programme.
      items:
        - subject: 'multiple actionable payroll contexts — the chooser'
          render: 'NOT_RENDER_VERIFIED_FIXTURE_UNAVAILABLE'
          keyboard: 'NOT_AUTOMATED_KEYBOARD_VERIFIED_FIXTURE_UNAVAILABLE'
          why: >
            Every one of the five entities has one monthly pay group and at most one non-terminal
            run, so the branch never mounts. `PayGroup.entityId` permits more than one population per
            employer, which is why the branch exists and was not deleted.
        - subject: 'unresolved funding position'
          render: 'NOT_RENDER_VERIFIED_FIXTURE_UNAVAILABLE'
          keyboard: 'NOT_APPLICABLE — the state carries no interactive control'
          why: >
            Every entity resolves a default funding account whose currency matches its runs, so the
            truthful no-position state never renders. It is the branch that keeps P02-DEF-001A closed
            for a company with no compatible account. The source and domain containment path remains
