p01_group_payroll_control:
  schema_version: '1.0'
  status: 'normative'
  authority: 'page-contract'

  id: 'P01'
  workspace: 'Group Payroll Control Centre'
  route: '/payroll'
  internal_name: 'Group Payroll Control'
  archetype: 'operational command surface with an embedded consolidation surface'

  # ---------------------------------------------------------------------------
  # RELEASE
  # ---------------------------------------------------------------------------

  release:
    status: 'FROZEN_V1'
    frozen_on: '2026-09-08'

    frozen:
      - 'two-zone architecture: Operate leads, the Entity Control Matrix separates, Reconcile follows'
      - 'information hierarchy: where/when/scope, on track, attention, which entity, what changed, what must be funded, what happens next'
      - 'scope model: period is operational; reporting currency, rate basis and comparison are interpretation; view is perspective; company and jurisdiction rejected'
      - 'Entity Control Matrix responsibility: one table, operational by default, reconciliation behind column visibility, drillable to P02'
      - 'contract-gap policy: a section narrows to what stored records prove and says so on screen'
      - 'responsive operational spine: group state, attention, next actions, companies survive to 390px'

    reopening: >
      Any of the above requires a new entry under `divergences` stating what changed. A contract
      gap closing is not a reopening — it widens a section that was already declared narrow.

    evidence:
      contrast: 'P01-DEF-001 resolved; ratios under evaluation.resolved_defects, both themes'
      keyboard: 'manual-acceptance-ledger row 14 closed 2026-09-08, full sequence observed'
      gates: 'check-types, lint, build and audit.py all pass at commit time'
      render: 'desktop light and dark verified; 390px verified on the identical layout before the colour-only change'

    still_open_not_blocking:
      - 'manual-acceptance-ledger rows 12 and 13 — tab order through Needs attention and Next actions'
      - 'sidebar-collapsed capture — the harness could not reliably trigger it; no defect observed'
      - 'audit.py card-title budget still reads 83 against an actual 77'

  # ---------------------------------------------------------------------------
  # AUTHORITY
  # ---------------------------------------------------------------------------

  authority_chain:
    outranked_by:
      - '.architecture/ux/afenda-ui-ux-doctrine.yaml'
      - '.architecture/payroll/afenda-payroll-architecture.yaml'

    supersedes:
      - '.HITL/GROUP-PAYROLL-UX.md'
      - '.HITL/GROUP-PAYROLL.yaml'
      - '.HITL/group-payroll-plan.md'

    rule: >
      This file decides what P01 shows and in what order. The doctrine decides
      the interaction grammar. The architecture decides the programme. Prose
      under .HITL/ resolves nothing.

  # ---------------------------------------------------------------------------
  # PURPOSE
  # ---------------------------------------------------------------------------

  purpose: >
    Understand whether group payroll is on track and where intervention is
    required.

  core_question: >
    Across the entire group, will everybody who can legitimately be paid be paid
    correctly and on time — and where does the operator need to act?

  is_not:
    - generic_executive_dashboard
    - calculator
    - employee_register
    - payment_ledger
    - report_catalogue
    - compliance_filing_page

  # ---------------------------------------------------------------------------
  # DECLARED DIVERGENCE — the two-zone resolution
  # ---------------------------------------------------------------------------

  divergences:
    - id: 'P01-DIV-001'
      subject: 'the dominant figure'

      source_position: >
        The programme source (§15.2) requires the hero to be "X of Y companies
        on track" and explicitly rejects employer cost as the dominant figure,
        on the grounds that P01 is an operational command surface rather than a
        financial-reporting page.

      conflicting_position: >
        The shipped surface was built and accepted against a consolidation
        specification whose constitutional rules are "no consolidated number
        without coverage" and "no financial number without explanation". Under
        those rules the consolidated employer cost is the point of the page, and
        the repo design system records its 60px treatment as correct.

      resolution: 'two_zones'

      decision: >
        P01 carries both, separated. Zone 1 is operational and leads the page:
        the on-track band is the first figure read, and attention, next actions
        and the entity matrix follow it. Zone 2 is the consolidation surface,
        unchanged, beginning below the matrix with the employer cost figure at
        its existing weight.

      reasoning: >
        The two specifications answer different questions and neither is wrong.
        Demoting employer cost would discard an accepted surface to satisfy a
        hierarchy rule; ignoring §15.2 would leave the operator without the
        state the page exists to report. Separating them by the matrix means
        neither is a competing focal point in one viewport, which is the actual
        constraint behind "spend emphasis once".

      binding: >
        This resolution is settled. It MUST NOT be re-litigated at each review.
        Reversing it requires a new divergence entry stating what changed.

      constraint: >
        The zone-1 band and the zone-2 60px figure MUST NOT be simultaneously
        visible as two focal points. The entity matrix separates them.

  # ---------------------------------------------------------------------------
  # BENCHMARK LESSONS — principles borrowed, never layouts
  # ---------------------------------------------------------------------------

  benchmark:
    rule: 'Borrow operating principles. Do not copy visual implementations.'

    workday:
      borrow:
        [
          centralized_payroll_status,
          pay_cycle_command_centre_thinking,
          employee_change_visibility,
          payroll_status_monitoring,
          recommended_work_and_tasks,
          anomaly_drill_down
        ]

    sap_payroll_control_center:
      borrow:
        [exception_first_operation, validation_discipline, issue_remediation, alert_ownership, payroll_kpi_monitoring]
      strongest_lesson: 'Payroll problems should become resolvable work, not merely report rows.'

    oracle_payroll_activity_center:
      borrow:
        [
          current_vs_prior_period_comparison,
          gross_deduction_contribution_net_comparison,
          variance_clarity,
          detailed_reconciliation
        ]

    deel_and_modern_global_payroll:
      borrow: [global_legal_entity_visibility, jurisdiction_awareness, modern_presentation, payroll_cost_visibility]

    synthesis: >
      Workday command-centre thinking, SAP exception discipline, Oracle
      reconciliation clarity, modern global visibility, and Afenda simplicity
      with contextual operation.

  # ---------------------------------------------------------------------------
  # INFORMATION HIERARCHY
  # ---------------------------------------------------------------------------

  information_hierarchy:
    rule: 'This vertical order matters more than the individual components.'

    order:
      - where_when_scope
      - are_we_on_track
      - what_needs_attention
      - which_entity_needs_action
      - what_changed
      - what_must_be_funded_or_paid
      - what_happens_next

  # ---------------------------------------------------------------------------
  # ANATOMY
  # ---------------------------------------------------------------------------

  anatomy:
    zone_1:
      name: 'Operate'
      question: 'Is the group on track, and where must I act?'

      sections:
        - id: 'header'
          must_show:
            [payroll, selected_payroll_period, group_scope, legal_employer_count, jurisdiction_count, currency_count]
          primary_action: 'Open run queue'
          rule: 'Limit permanent global filters. Lower-frequency actions belong in overflow.'

          # Corrected 2026-09-08. The earlier list — period, company, jurisdiction, currency basis
          # — predates the two-zone architecture and mixed three different jobs into one row.
          # Grouped by what each control actually decides:
          scope_controls:
            operational_scope:
              controls:
                - id: 'period'
                  decides: 'which payroll the whole page is about'
              note: 'The only control that changes what zone 1 reports.'

            reconciliation_interpretation:
              controls:
                - id: 'reporting_currency'
                  decides: 'what consolidated figures are stated in'
                - id: 'exchange_rate_basis'
                  decides: 'which rate they are translated at'
                - id: 'comparison'
                  decides: 'what the movement is measured against'
              note: >
                These three change how zone 2 reads and never what zone 1 reports. Readiness,
                attention and next actions are the same facts in any currency.

            perspective:
              controls:
                - id: 'view'
                  decides: 'operational payroll, with the financial allocation seam declared and disabled'
              note: 'The seam is rendered and disabled, so the divergence between legal employer and cost allocation stays visible.'

          rejected_controls:
            - id: 'company'
              reason: >
                P01 is group-oriented. A company filter would turn it into a single-company
                dashboard, which is P02 Entity Payroll Workspace. Every matrix row already drills
                there, carrying the analytical context back.

            - id: 'jurisdiction'
              reason: >
                Does not earn a permanent global filter. Country is already available as a
                consolidation dimension, which is the analytical job it was wanted for, and the
                doctrine's capability_without_chrome rule forbids keeping a control merely because
                an earlier target listed it. Revisit only if a jurisdiction genuinely gates
                operational work at group level.

        - id: 'on_track_band'
          dominant_message: 'X of Y companies on track'
          supporting: [total_employees, ready, needs_review, blocked, next_payroll_deadline]
          rule: 'This is zone 1 leading figure. It is not a card grid.'

        - id: 'needs_attention'
          max_items: 5
          each_item_exposes:
            [severity, affected_object_or_scope, plain_language_reason, consequence, deadline_when_relevant, one_action]

          ordering: >
            By consequence, worst first. A company that cannot fund its own payroll outranks one
            that cannot approve it, which outranks one carrying unacknowledged warnings, which
            outranks a company missing from the total.

          empty_state: >
            Zero items is a legitimate and good answer. The section says nothing is holding up the
            period and names what it checked.

          MUST_NOT:
            - 'expose a giant alert archive'
            - 'pad the list to reach a count'

          # Removed 2026-09-08. `min_items: 3` required at least three items on a surface whose
          # items are supposed to be genuine blockers. A month can legitimately contain zero, one
          # or two, and a floor makes the interface manufacture work to fill a layout — which is
          # truth_before_convenience inverted. The maximum stays; only the minimum was the defect.
          no_minimum: true

        - id: 'next_actions'
          shows: [ranked_work, actual_task, affected_scope, due_context, direct_destination]
          MUST_NOT:
            - 'be a Quick Actions grid of generic links to Reports, Payments, Compliance, Settings'
          rule: 'Navigation is not work.'

        - id: 'entity_control_matrix'
          role: 'centrepiece of P01'
          row_opens: 'P02 Entity Payroll Workspace'

          rule: >
            One table, dense, company-first, URL and context preserving, drillable to P02, and
            truthful. MUST NOT become a card grid, a second entity table, or a second table engine.

          # Corrected 2026-09-08. The default columns were reconciliation-oriented — In the total,
          # Employer cost, Change — on the centrepiece of the Operate zone, so the table could not
          # answer which company needs action, how many people are affected, or when payday is.
          # One table still: the reconciliation columns are hideable rather than removed, and the
          # engine's own column menu turns them back on without losing sort, selection or scroll.
          default_columns: [company, people, ready, issues, payday, net_pay, payroll_state]

          hideable_columns: [in_the_total, employer_cost, change]

          column_notes:
            ready: >
              People not stopped by an open blocking or error exception. Stated as unknown, never
              as a number, when the run has a blocker naming a department rather than a person —
              that affects an unknown count, and subtracting only the named ones would report more
              people ready than the run can prove.
            issues: >
              Open exceptions as severity badges. A rank for sorting, not a figure.
            net_pay: >
              Reporting currency, with the company's own currency beneath. Totalled in the footer
              because every row is already converted.

          narrowed_columns:
            - id: 'payroll_period'
              reason: >
                The page selects one period globally, so a per-row period column would repeat the
                same value on every row. The doctrine forbids meaningless columns.

            - id: 'funding_state'
              reason: >
                Belongs to "Can the group pay?", which states it per company in that company's own
                currency. Duplicating it here would either repeat that card or compress a
                per-currency fact into one column.

            - id: 'approval_state'
              reason: 'Already carried by payroll_state, whose vocabulary includes review, ready and paid.'

            - id: 'statutory_readiness'
              reason: >
                Not provable per company on this table without duplicating the Compliance
                workspace. Statutory readiness has its own compact section in zone 2.

    zone_2:
      name: 'Reconcile'
      question: 'What does the group cost, what is in that number, and how did it move?'

      # Corrected 2026-09-08 to the rendered order, which was visually validated and reads better
      # than the order this file previously declared. The old sequence put consolidate_by — the
      # deepest analytical surface on the page — above statutory and the timeline, and separated
      # the two "what changed" sections with three cards. The order below runs state, then
      # explanation, then movement in money and in people, then exposure, then the forward-looking
      # pair, then the deepest breakdown last. `sections` below is listed in this order.
      order:
        - group_employer_cost
        - net_pay_and_readiness
        - variance
        - changes_affecting_payroll
        - funding_and_payment_exposure
        - statutory_snapshot
        - payroll_timeline
        - consolidate_by

      sections:
        - id: 'group_employer_cost'
          rule: 'The consolidated figure at its accepted weight, always carrying coverage beside it.'
          constitutional_rules:
            - 'No consolidated number without coverage.'
            - 'No financial number without explanation.'

        - id: 'net_pay_and_readiness'
          shows: [net_pay, gross_pay, state_breakdown_by_named_company]

        - id: 'variance'
          question: 'What changed from the previous comparable payroll?'
          measures: [employees, gross_payroll, net_payroll, employer_cost]
          drivers: [new_hires, salary_changes, overtime, terminations, bonus]
          prefer: 'exact values and explanation before charts'
          employer_cost_direction: 'neutral'
          note: 'Higher employer cost is not automatically bad.'

        - id: 'changes_affecting_payroll'
          categories:
            [
              new_joiners,
              terminations,
              inter_company_transfers,
              salary_changes,
              pay_group_changes,
              unpaid_leave,
              bank_changes
            ]
          form: 'compact list or matrix'
          MUST_NOT: 'create one card per change category'
          note: 'Inter-company transfer deserves group-level visibility because it affects multiple legal employers.'

        - id: 'funding_and_payment_exposure'
          rule: 'By currency. Never one converted group total.'
          MUST_NOT:
            - 'show Group Payroll Total = X unless a governed FX methodology exists'
            - 'imply balances held by different companies are freely transferable'

        - id: 'statutory_snapshot'
          question: 'Is statutory readiness threatening payroll delivery?'
          shows:
            [
              ready_companies,
              companies_requiring_review,
              capability_gaps,
              nearest_material_statutory_deadline_when_known
            ]
          rule: 'Deliberately compact. MUST NOT duplicate the Compliance workspace.'

        - id: 'payroll_timeline'
          shows: [payroll_payday, approval_deadline, funding_deadline, statutory_deadline, close_deadline]
          form: 'short chronological list or rail'
          MUST_NOT: 'default to a full monthly calendar'

        - id: 'consolidate_by'
          dimensions: [entity, country, currency, department, cost_centre, component]
          note: 'Last on the page. The deepest analytical surface, reached after the state it explains.'

  # ---------------------------------------------------------------------------
  # ENTITY STATE MODEL
  # ---------------------------------------------------------------------------

  entity_state_model:
    payroll_states:
      [not_started, preparing, needs_review, blocked, ready, in_review, approved, payment_processing, paid, closed]

    rule: >
      Payroll lifecycle state MUST NOT be confused with payment or compliance
      sub-state. "Payroll: Ready", "Payments: 3 held" and "Compliance: Review"
      may all be simultaneously true.

    processing_readiness: [ready, needs_review, blocked, excluded]
    settlement_lifecycle: [not_released, released, processing, paid]

    MUST_NOT: 'combine processing readiness and settlement lifecycle into one overloaded status vocabulary'

  # ---------------------------------------------------------------------------
  # RESPONSIVE
  # ---------------------------------------------------------------------------

  responsive:
    rule: 'Compact MUST NOT simply stack every desktop block indefinitely.'

    preserved_spine:
      - group_state
      - attention
      - companies
      - next_actions

    secondary_may_collapse: true

    test: 'The compact page still allows the operator to understand the situation within seconds.'

  # ---------------------------------------------------------------------------
  # ANTI-PATTERNS
  # ---------------------------------------------------------------------------

  anti_patterns:
    challenge_or_reject:
      - giant_donut_charts
      - eight_to_twelve_equal_kpi_cards
      - generic_quick_action_grids
      - mixed_currency_totals
      - decorative_colour
      - ai_summary_boxes_without_operational_value
      - full_employee_tables
      - duplicated_compliance_payment_or_report_work
      - card_grid_replacement_for_legal_entity_control
      - navigation_disguised_as_tasks
      - charts_that_hide_exact_values
      - charts_created_merely_to_look_analytical

  # ---------------------------------------------------------------------------
  # CONTRACT GAPS — recorded, never rendered
  # ---------------------------------------------------------------------------

  contract_gaps:
    rule: >
      Each entry is a FRONTEND CONTRACT GAP under architecture A01. The affected
      section ships in its provable form only. Rendering the missing state in
      any form violates truth_before_convenience.

    open:
      - id: 'P01-GAP-001'
        subject: 'inter-company transfer records'
        blocks: 'changes_affecting_payroll'
        evidence: 'No movement or transfer model exists in the domain. Architecture A07 forbids reconstructing transfer history from current values alone.'
        consequence: 'Changes ships joiners and terminations only — two categories, not seven.'

      - id: 'P01-GAP-002'
        subject: 'approval, funding and close deadlines'
        blocks: 'payroll_timeline'
        evidence: 'PaySchedule carries periodStart, periodEnd, cutoff, payDate and status. It carries no approval, funding or close deadline.'
        consequence: 'Timeline shows cut-off, payday and statutory due dates only.'

      - id: 'P01-GAP-003'
        subject: 'compensation history'
        blocks: 'variance drivers — salary changes'
        evidence: 'Compensation.effectiveFrom is the currently-effective record only. There is no prior value, so a change magnitude cannot be stated.'
        consequence: 'A compensation effective date inside the period may be stated. An increase amount may not.'

      - id: 'P01-GAP-004'
        subject: 'pay-group, bank-detail and unpaid-leave change history'
        blocks: 'changes_affecting_payroll'
        evidence: 'No history records exist for these dimensions.'
        consequence: 'These categories are omitted rather than inferred from current values.'

  # ---------------------------------------------------------------------------
  # EVALUATION
  # ---------------------------------------------------------------------------

  evaluation:
    scoring:
      immediate_orientation: 15
      payroll_operational_usefulness: 20
      issue_and_action_clarity: 15
      entity_level_control: 15
      drill_down_quality: 10
      information_hierarchy_and_density: 10
      domain_and_financial_truth: 10
      visual_and_responsive_quality: 5

    minimum: 85

    rule: 'Hard failures override the numerical score.'

    hard_failures:
      - 'a consolidated figure rendered without its coverage'
      - 'a mixed-currency total without a governed FX basis'
      - 'a state the domain cannot prove'
      - 'navigation presented as ranked work'
      - 'the entity matrix rendered as a card grid'
      - 'zone 1 and zone 2 focal points competing in one viewport'

    gates:
      - 'pnpm check-types'
      - 'pnpm lint'
      - 'pnpm build'
      - 'python .claude/skills/xforge-design-system/scripts/audit.py'
      - 'scripts/measure.js in both themes, renderedOk true'
      - 'rendered validation per architecture A15 visual_validation_method'

    resolved_defects:
      - id: 'P01-DEF-001'
        subject: 'semantic status text contrast'
        status: 'RESOLVED 2026-09-08'

        was: >
          A status token did two incompatible jobs. `--warning` tinted a surface at 15% alpha and
          coloured the text on it, and a hue light enough to keep the tint quiet measured 2.02:1 as
          text on that tint. All four status colours failed the 4.5:1 floor in light theme.

        fix: >
          Split the roles at the token authority in src/app/globals.css. The surface keeps
          --destructive / --warning / --success / --info at their existing values, so every tint,
          solid fill, border and chart is byte-identical. Text moves to a new --*-strong token of
          the same hue and chroma at a lightness chosen to clear the floor, exposed through @theme
          as text-destructive-strong and friends. No page-local override, no forked badge, no
          solid-fill badge, and no reliance on icon redundancy.

        measured_light:
          floor: 4.5
          destructive: { text_on_tint: { old: 3.26, new: 5.25 }, text_on_card: { old: 3.72, new: 5.98 } }
          warning: { text_on_tint: { old: 2.02, new: 5.01 }, text_on_card: { old: 2.28, new: 5.65 } }
          success: { text_on_tint: { old: 3.13, new: 4.97 }, text_on_card: { old: 3.71, new: 5.9 } }
          info: { text_on_tint: { old: 3.43, new: 4.96 }, text_on_card: { old: 3.87, new: 5.6 } }

        measured_dark:
          note: >
            Taken with a theme preset active, which lightens the card to oklch(0.27) and is the
            harder case — that preset is what made destructive fail at 3.70 before.
          destructive: { text_on_tint: { old: 3.7, new: 5.33 }, text_on_card: { old: 4.07, new: 5.87 } }
          warning: { text_on_tint: { old: 5.81, new: 5.78 }, text_on_card: { old: 7.96, new: 7.92 } }
          success: { text_on_tint: { old: 4.78, new: 5.81 }, text_on_card: { old: 6.13, new: 7.44 } }
          info: { text_on_tint: { old: 4.91, new: 6.11 }, text_on_card: { old: 5.75, new: 7.15 } }

        affected_tokens: ['--destructive', '--warning', '--success', '--info']

        shared_consumers_updated: >
          223 call sites across 88 files. The five payroll style authorities — payroll-metrics
          (exception severity, exception status, pay-run status), payroll-group (entity state),
          payroll-compliance (filing status), payroll-payments (batch and settlement), and
          payroll-workspace (employee and payment state) — plus the badge and button variants in
          components/ui and every view that coloured status text directly.

        preset_independence: >
          --destructive is one of the variables a theme preset overwrites at runtime; --warning,
          --success and --info are not. The --*-strong tokens are defined only in globals.css, so
          the readable colour no longer depends on which preset is active.

        regression_checked: >
          /payroll, /payroll/runs and /payroll/compliance rendered in both themes. Tint surfaces
          unchanged, per-currency figures unchanged, no status meaning carried by colour alone.

    unverifiable_interactions: >
      Any keyboard or pointer gate the browser automation cannot exercise is
      recorded in .architecture/ux/manual-acceptance-ledger.md as NOT VERIFIED.
      Construction evidence is never a PASS.
